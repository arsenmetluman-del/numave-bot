*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0a0a0a;color:#e8e8ed;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',sans-serif;font-weight:500;-webkit-font-smoothing:antialiased}

.sim-chip-el::after{content:'';position:absolute;top:3px;left:6px;width:18px;height:5px;border-radius:3px;background:rgba(255,255,255,.5);filter:blur(1.5px)}

.sim-lte{position:absolute;top:14px;right:14px;padding:3px 8px;border:1px solid #4a4a4e;border-radius:4px;font-size:8px;font-weight:800;color:#e8e8ed;letter-spacing:1px;z-index:3}
.sim-iccid{position:absolute;top:52px;right:14px;font-size:7px;font-family:'JetBrains Mono',monospace;color:#6e6e78;letter-spacing:.5px;line-height:1.4;z-index:3;text-align:right}

.sim-card.r-legendary .sim-number{color:#ffd60a}
.sim-contacts-el{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:4px;z-index:3}

.matrix-layer{position:absolute;inset:0;background:linear-gradient(160deg,#2e2e32 0%,#1c1c20 100%);display:flex;align-items:center;justify-content:center;border-radius:10px;opacity:0;transition:opacity .35s ease;pointer-events:none;z-index:6;clip-path:polygon(0 0,100% 0,100% 76%,82% 100%,0 100%)}

.sim-mini .mc-b{bottom:0;left:14%;width:16%;height:3px;border-radius:2px 2px 0 0}
.sim-mini .mc-r{top:36%;right:0;transform:translateY(-50%);width:3px;height:10px;border-radius:2px 0 0 2px}
.sim-mini .chip{width:32px;height:24px;background:linear-gradient(140deg,#f5d060 0%,#e0b840 25%,#c9a030 55%,#a6821c 85%);border-radius:4px;position:absolute;top:26px;left:10px;box-shadow:inset 0 1px 2px rgba(255,255,255,.55),inset 0 -1px 2px rgba(0,0,0,.4),0 2px 4px rgba(0,0,0,.5);overflow:hidden}

.sim-mini .brand{position:absolute;top:8px;left:10px;display:flex;align-items:center;gap:4px;z-index:3}

.sim-mini .num{position:absolute;left:10px;right:10px;bottom:16px;font-size:11px;font-weight:800;font-family:'JetBrains Mono',monospace;text-align:center;color:#fff;z-index:3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sim-mini.r-rare .num{color:#4a90e2}
.sim-mini.r-epic .num{color:#a855f7}
.sim-mini.r-legendary .num{color:#ffd60a}
.sim-mini .contacts{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);display:flex;gap:2px;z-index:3}

.sim-mini.lg .num{font-size:14px;bottom:22px}
.sim-mini.md{width:180px;height:115px}
.sim-mini.md .num{font-size:12px;bottom:18px}
.sim-status{text-align:center;font-size:11px;color:#a8a8b0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0 16px;line-height:1.4;font-weight:500;margin-bottom:14px;min-height:40px}
.sim-status .row{display:flex;align-items:center;gap:6px}
.sim-status .dot{width:5px;height:5px;border-radius:50%;background:#30d158;flex-shrink:0}
.sim-status.rarity-rare .dot{background:#4a90e2}
.sim-status.rarity-epic .dot{background:#a855f7}
.sim-status.rarity-legendary .dot{background:#ffd60a}
.sim-status .txt b{color:#fff;font-weight:700}
.sim-status.rarity-legendary .txt b{color:#ffd60a}
.sim-status .reason{font-size:9px;color:#8e8e93;font-style:italic;line-height:1.3}
.top-actions{display:flex;gap:8px;margin-bottom:12px}
.btn-spin-main{flex:1.5;padding:15px;background:#2e2e33;border:1px solid #4a4a4e;border-radius:12px;color:#fff;font-size:13px;font-weight:800;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s}
.btn-spin-main:active{transform:scale(.97);background:#3a3a40}
.btn-spin-main:disabled{background:#1a1a1a;color:#6e6e78;border-color:#2a2a2e;cursor:not-allowed}
.btn-spin-main svg{width:16px;height:16px}
.btn-spin-main .spin-count{font-size:10px;font-weight:600;color:#a8a8b0;margin-left:4px}
.btn-claim-main{flex:1;padding:15px 12px;background:#2e2e33;border:1px solid #4a4a4e;border-radius:12px;color:#fff;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .15s}
.btn-claim-main:active{transform:scale(.97);background:#3a3a40}
.btn-claim-main:disabled{opacity:.35;cursor:not-allowed}
.btn-claim-main svg{width:14px;height:14px}
.stats-strip{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#16161a;border:1px solid #2a2a2e;border-radius:12px;margin-bottom:14px;font-size:11px}
.stats-strip .item{display:flex;align-items:center;gap:5px;color:#8e8e93;font-weight:500}
.stats-strip .item b{color:#fff;font-weight:700;font-family:'JetBrains Mono',monospace}
.stats-strip .item svg{width:13px;height:13px}
.stats-strip .divider{width:1px;height:12px;background:#2a2a2e}
.stats-strip .rarity-dots{display:flex;align-items:center;gap:10px}

.stats-strip .rdot i{width:8px;height:8px;border-radius:50%;display:inline-block}
.rdot i.c-common{background:#fff}
.rdot i.c-rare{background:#4a90e2}
.rdot i.c-epic{background:#a855f7}
.rdot i.c-legendary{background:#ffd60a}
.chances-block{margin-bottom:16px;padding:14px;background:#16161a;border:1px solid #2a2a2e;border-radius:12px}
.chances-title{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#a8a8b0;margin-bottom:10px;font-weight:500;cursor:pointer}
.chances-title svg{width:13px;height:13px;color:#a8a8b0}
.chance-bar{height:3px;background:#2a2a2e;border-radius:2px;overflow:hidden;margin-bottom:5px}

.chance-fill.c-common{background:#fff}
.chance-fill.c-rare{background:#4a90e2}
.chance-fill.c-epic{background:#a855f7}
.chance-fill.c-legendary{background:#ffd60a}
.chances-list{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;font-size:10px;color:#8e8e93;margin-top:10px}
.chance-item{display:flex;align-items:center;gap:5px;font-weight:500}
.chance-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.chance-dot.c-common{background:#fff}
.chance-dot.c-rare{background:#4a90e2}
.chance-dot.c-epic{background:#a855f7}
.chance-dot.c-legendary{background:#ffd60a}
.chance-item b{color:#fff;font-weight:700;margin-left:auto}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;padding:8px 0 12px;background:rgba(10,10,10,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid #1a1a1e;z-index:100}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;color:#6e6e78;font-size:9px;cursor:pointer;transition:color .2s;width:20%;font-weight:600;letter-spacing:.3px;position:relative}

.nav-item.active{color:#fff}
.nav-badge{position:absolute;top:-2px;right:18%;background:#ff3b30;color:#fff;font-size:9px;font-weight:800;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid #0a0a0a}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);backdrop-filter:blur(10px);z-index:200;padding:20px;flex-direction:column;justify-content:center;align-items:center}
.modal-content{background:#16161a;padding:20px;border-radius:16px;max-width:360px;width:100%;border:1px solid #2a2a2e;max-height:88vh;overflow-y:auto}

.modal-close{background:#2a2a2e;color:#fff;padding:12px 14px;border-radius:10px;border:none;cursor:pointer;width:100%;margin-top:10px;font-weight:700;font-size:13px;font-family:inherit}
.modal-btn-primary{background:#fff;color:#0a0a0a;padding:14px;border-radius:10px;border:none;cursor:pointer;width:100%;margin-top:10px;font-weight:800;font-size:13px;font-family:inherit}
.modal-btn-primary:disabled{background:#2a2a2e;color:#6e6e78;cursor:not-allowed}
.top-item{background:linear-gradient(135deg,#16161a 0%,#1a1a1e 100%);border:1px solid #2a2a2e;border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px;margin-bottom:10px;cursor:pointer;position:relative;overflow:hidden;transition:all .3s;animation:topSlide .4s ease forwards}
@keyframes topSlide{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
.top-item:active{transform:scale(.98)}
.top-item::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:#2a2a2e}
.top-item.me::before{background:#fff}
.top-item.rank-1::before{background:linear-gradient(180deg,#ffd60a,#b89a10)}
.top-item.rank-2::before{background:linear-gradient(180deg,#e8e8ed,#8e8e93)}

.top-item.rank-1{background:linear-gradient(135deg,rgba(255,214,10,.08) 0%,#16161a 50%);border-color:rgba(255,214,10,.3)}
.top-item.rank-2{background:linear-gradient(135deg,rgba(232,232,237,.05) 0%,#16161a 50%);border-color:rgba(232,232,237,.2)}
.top-item.rank-3{background:linear-gradient(135deg,rgba(205,127,50,.05) 0%,#16161a 50%);border-color:rgba(205,127,50,.2)}
.top-rank{font-size:14px;font-weight:800;min-width:36px;height:36px;border-radius:50%;color:#6e6e78;font-family:'JetBrains Mono',monospace;text-align:center;display:flex;align-items:center;justify-content:center;border:1.5px solid #2a2a2e;background:#0a0a0a}

.top-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#2a2a2e,#1a1a1e);border:2px solid #3a3a3e;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;color:#fff;flex-shrink:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.1);position:relative}
.top-item.rank-1 .top-avatar{border-color:#ffd60a}
.top-item.rank-2 .top-avatar{border-color:#e8e8ed}
.top-item.rank-3 .top-avatar{border-color:#cd7f32}
.online-dot{position:absolute;bottom:0;right:0;width:10px;height:10px;border-radius:50%;background:#30d158;border:2px solid #16161a;box-shadow:0 0 8px #30d158}
.top-info{flex:1;min-width:0}

.top-meta .m-item svg{width:10px;height:10px}
.top-value{font-size:15px;font-weight:800;color:#ffd60a;font-family:'JetBrains Mono',monospace;white-space:nowrap}

.hidden{display:none!important}
@keyframes flashAnim{0%{opacity:0}30%{opacity:.7}100%{opacity:0}}

.filter-btn.active{background:#fff;color:#0a0a0a;border-color:#fff}
